name: arena_go
description: ArenaGo - Turf Booking App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.1.0
  firebase_storage: ^12.1.0
  firebase_messaging: ^15.0.0
  # State Management & Navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.1.4
  # Payment
  razorpay_flutter: ^1.3.6
  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
